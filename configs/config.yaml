defaults:
  - _self_
  - override hydra/job_logging: disabled # prevents .log generation

dataset:
  root: data
  crop: tomato

  # model: fcdensenet, frrna
  model: fcdensenet

  # image: all, thermal, visual
  image: thermal

  # mask: both, soft, hard
  mask: both

  # interpolation: nearest, area
  interpolation: nearest

  # target: direct, correction
  target: direct

train:
  seed: 0
  # model: base, mlp, cnn
  model: mlp
  # loss: mse, mae
  loss: mse
  epochs: 100
  batch_size: 16
  shuffle: true
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 15
  # optimizer: adam, adamw, sgd 
  optimizer: adamw

visualize:
  # split: train, valid, test
  split: test
  index: 0

evaluate:
  # split: train, valid, test
  split: test
  checkpoint: null

hydra:
  run:
    # dir: runs/${now:%Y-%m-%d_%H-%M-%S} # use if you want to save runs
    dir: .                             # use if you don't want to save runs
