defaults:
  - _self_
  - override hydra/job_logging: disabled # prevents .log generation

dataset:
  root: data
  crop: tomato
  # model: fcdensenet, frrna
  model: fcdensenet
  # image: thermal, visual, both (RGB + temperature + optional hard/soft masks)
  image: both
  # mask: both, soft, hard, none
  mask: hard
  # interpolation: nearest, area
  interpolation: nearest
  # target: direct, correction
  target: correction
  # reg_output: canopy, cwsi
  reg_output: cwsi
  # Percentage of upper and lower bound temperature
  bound: 5.0

train:
  seed: 0
  # model: mlp, cnn, resnet18, resnet34, resnet50
  model: cnn
  # loss: mse, mae
  loss: mse
  epochs: 200
  batch_size: 16
  shuffle: true
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5
  # optimizer: adam, adamw, sgd 
  optimizer: adamw
  # normalize: none, temp, all
  normalize: temp
  # name: dataset, train, all
  name: all
  output: checkpoints/base

# Transfer learning settings shared by all ResNet models
transfer:
  pretrained: true
  # Freeze residual blocks and BatchNorm; the regression head stays trainable
  freeze_backbone: true
  freeze_conv1: false
  # Applied only when conv1 is trainable; other layers use train.learning_rate
  lr_conv1: 0.0001
  # mask_init: zero, default
  mask_init: zero

visualize:
  # split: train, valid, test
  split: test
  index: 0
  output: visualize

evaluate:
  root: checkpoints/base
  # split: train, valid, test
  split: test
  # checkpoint: all, single
  checkpoint: all
  # Filename within root; required only when checkpoint is single
  name: null
  # true: baseline rows only; false: model rows only
  baseline: false
  # column: dataset, train, all
  column: all
  # metric: all (one row per temperature), avg (one row combining all temperatures)
  metric: avg
  output: results/metrics_base_avg.csv

hydra:
  run:
    # dir: runs/${now:%Y-%m-%d_%H-%M-%S} # use if you want to save runs
    dir: .                             # use if you don't want to save runs
